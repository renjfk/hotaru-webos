name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g., v0.2, or v0.2.0-rc1 for a release candidate)"
        required: true
        type: string
      release_notes:
        description: "Release notes content (markdown supported)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version from the tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          RC=false
          # a release candidate builds the app version it is a candidate for: v0.1.0-rc1 is 0.1.0
          if [[ "$VERSION" =~ ^(.+)-rc[0-9]+$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            RC=true
          fi
          # webOS wants three numbers: v0.2 is 0.2.0
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+$ ]] && VERSION="$VERSION.0"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag $RELEASE_TAG is not vMAJOR.MINOR, vMAJOR.MINOR.PATCH or one of them as -rcN"; exit 1; }
          # an RC is never published as a full release, whatever the input says
          if [[ "$RC" == true || "$PRERELEASE" == true ]]; then PRE=true; else PRE=false; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (prerelease: $PRE)"

      - name: Create and push release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Creating new tag: $RELEASE_TAG"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          else
            echo "Tag $RELEASE_TAG already exists"
          fi

      - name: Save release notes
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: printf '%s\n' "$RELEASE_NOTES" > release_notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  build:
    name: Build
    runs-on: macos-latest
    needs: prepare

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          submodules: true

      - name: Build the .ipk
        uses: ./.github/actions/build-ipk
        with:
          version: ${{ needs.prepare.outputs.version }}

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: |
            dist/*.ipk
            dist/*.ipk.sha256

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare, build]

    steps:
      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: ipk
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          body_path: release_notes.md
          draft: ${{ inputs.draft }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: false
          files: |
            dist/*.ipk
            dist/*.ipk.sha256
